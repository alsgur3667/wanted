function illustration(){return `<svg class="glass-art" viewBox="0 0 540 390" role="img" aria-label="이력서와 경험, 분석 결과가 연결된 입체 문서 일러스트"><defs><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".98"/><stop offset="1" stop-color="#e8e9e7" stop-opacity=".72"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#cbd8df"/><stop offset=".5" stop-color="#94adc0" stop-opacity=".68"/><stop offset="1" stop-color="#eff0eb" stop-opacity=".4"/></linearGradient><linearGradient id="orb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9d2b7"/><stop offset="1" stop-color="#6c8390"/></linearGradient><filter id="shadow" x="-30%" y="-30%" width="180%" height="180%"><feDropShadow dx="-7" dy="13" stdDeviation="13" flood-color="#8493a0" flood-opacity=".11"/></filter><radialGradient id="glow"><stop stop-color="#ede7da" stop-opacity=".8"/><stop offset="1" stop-color="#fdfbf7" stop-opacity="0"/></radialGradient></defs><ellipse cx="262" cy="260" rx="220" ry="115" fill="url(#glow)"/><ellipse cx="266" cy="211" rx="220" ry="60" fill="none" stroke="url(#orb)" stroke-width="1" transform="rotate(-35 266 211)"/><circle cx="438" cy="65" r="5" fill="#e9d4bc"/><circle cx="98" cy="324" r="4" fill="#a4b0b6"/><g transform="translate(137 89) skewY(-16)" filter="url(#shadow)"><rect width="130" height="203" rx="7" fill="url(#blue)"/><path d="M6 6h117v192H6Z" fill="white" opacity=".08"/></g><g transform="translate(104 122) skewY(-16)" filter="url(#shadow)"><rect width="144" height="204" rx="6" fill="url(#glass)" stroke="white" stroke-opacity=".9"/><path d="M21 35h68m-68 10h45" stroke="#8c9fad" stroke-width="3"/><path d="M21 73h99m-99 14h79m-79 14h98m-98 27h78m-78 14h99m-99 14h68" stroke="#bcc5ca" stroke-width="2"/><circle cx="122" cy="18" r="2" fill="#c5b18f"/></g><g transform="translate(298 116) skewY(-16)" filter="url(#shadow)"><rect width="97" height="135" rx="6" fill="url(#glass)" stroke="white"/><circle cx="49" cy="45" r="24" fill="#d9e4e8"/><circle cx="49" cy="38" r="9" fill="#8fa8bd"/><path d="M33 59c0-19 32-19 32 0" fill="#91acc4"/><path d="M24 90h54m-54 10h45m-45 10h52" stroke="#b5c3cb" stroke-width="2"/></g><g transform="translate(223 281) skewY(-16)" filter="url(#shadow)"><rect width="222" height="103" rx="7" fill="url(#glass)" stroke="#fff"/><path d="M23 71V50h9v21m9 0V37h9v34m9 0V23h9v48" stroke="#a3b3be" stroke-width="4" fill="#a3b3be"/><path d="M89 29h109m-109 14h79m-79 14h107m-107 14h91" stroke="#b6c2c9" stroke-width="3"/></g><circle cx="443" cy="228" r="4" fill="#c9aa86"/></svg>`}
function waves(){return `<div class="service-art"><svg viewBox="0 0 440 190" role="img" aria-label="경험 데이터가 연결되는 흐름"><defs><linearGradient id="wavebg"><stop stop-color="#354651"/><stop offset="1" stop-color="#131e25"/></linearGradient><linearGradient id="line"><stop stop-color="#c0c6c7" stop-opacity=".5"/><stop offset=".65" stop-color="#c3a77b" stop-opacity=".7"/><stop offset="1" stop-color="#a5adb2" stop-opacity=".1"/></linearGradient></defs><rect width="440" height="190" fill="url(#wavebg)"/><text x="28" y="29" fill="#ecf0ef" font-size="8" letter-spacing="3" font-family="Arial">DATA × AI × CAREER</text>${Array.from({length:24},(_,i)=>`<path d="M-10 ${145+i*2} C 120 ${215-i*2}, 196 ${23+i*3}, 450 ${55+i*3}" stroke="url(#line)" stroke-width=".6" fill="none"/>`).join('')}${Array.from({length:22},(_,i)=>`<circle cx="${35+i*17}" cy="${100+Math.sin(i)*36}" r="${i%3===0?2:1}" fill="#bea477" opacity="${.3+i%4*.15}"/>`).join('')}</svg></div>`}
function header(company){return `<header class="header"><div class="wrap"><a class="brand" href="#personal">Career Navi</a><nav aria-label="주요 메뉴"><a href="${company?'#personal':'#service'}" onclick="${company?'':'scrollSection(event,\'service\')'}">서비스 소개</a><a href="#how" onclick="scrollSection(event,'how')">이용 방법</a><a href="#faq" onclick="showFAQ(event)">자주 묻는 질문</a></nav><a class="btn" href="${company?'#personal':'#companies'}">${company?'경험 입력':'기업 둘러보기'}</a></div></header>`}
function hero(company=false){return `<section class="hero ${company?'company-hero':''}"><div class="wrap"><div class="label">${company?'FIND YOUR NEXT COMPANY':'YOUR EXPERIENCE, NEXT CAREER'}</div><h1>${company?'함께 성장할 팀을<br>찾아보세요.':'<span>쌓아온 경험에서,</span><br>다음 가능성을 찾아보세요.'}</h1><p>${company?'나의 커리어 관심사와 역량을 펼칠 기업을 발견하고,<br>함께할 팀의 채용 조건을 살펴보세요.':'이력서나 직접 적은 경험을 바탕으로 강점과 연결되는 직무를 살펴봅니다.<br>직무명보다 어떤 일을 했는지가 중요합니다.'}</p></div></section>`}
function banner(company){return `<section class="panorama"><div class="wrap"><div><div class="label">CAREER NAVI</div><h2>${company?'지금, 당신의 커리어를 함께할 회사를 찾아보세요.':'지금, 당신의 다음 가능성을 시작하세요.'}</h2></div><a class="btn light" href="${company?'#search':'#input'}" onclick="scrollSection(event,'${company?'search':'input'}')">${company?'관심 기업 찾아보기':'나의 커리어 경로 찾기'} <span>→</span></a></div></section><div class="endnote">검토용 시안 · 화면의 기업과 공고 정보는 예시입니다. 실제 로그인·분석·지원은 연결하지 않았습니다.</div>`}
function personal(){return `${header(false)}${hero()}<main><div class="wrap"><section class="steps" id="how">${[['경험 입력','나의 경험을 입력하거나 파일을 업로드하세요.'],['역량 분석','입력한 경험을 바탕으로 강점을 분석합니다.'],['커리어 경로 확인','경험과 연결되는 직무와 준비할 내용을 살펴봅니다.']].map(([a,b],i)=>`<div class="step"><strong>0${i+1}</strong><div><h3>${a}</h3><p>${b}</p></div></div>`).join('')}</section><section class="experience" id="input"><div><div class="section-number">01</div><h2>어떤 경험을 해오셨나요?</h2><p>팀 프로젝트, 인턴십, 전공 수업, 동아리 활동 등 다양한 경험도 분석할 수 있어요.<br>직장 경험이 없더라도 걱정하지 마세요.</p><div class="input-top"><div class="segment"><button id="type-tab" class="active" onclick="switchInput(false)">직접 입력</button><button id="file-tab" onclick="switchInput(true)">파일 업로드</button></div><button class="linkbtn" onclick="demoDialog()">데모 내용 선택</button></div><div class="inputzone"><label class="sr-only" for="experience">경험 내용</label><textarea id="experience" placeholder="어떤 일을 맡았고, 어떻게 해결하셨나요?&#10;예) 매출 자료를 엑셀로 정리하고, 반복되는 보고 업무를 개선했습니다."></textarea><div class="upload hidden" id="upload" tabindex="0" role="button" aria-label="이력서 파일 선택" onclick="document.getElementById('file').click()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();document.getElementById('file').click()}">${icon('upload')}<strong id="file-label">이력서 또는 경험 내용을 여기에 업로드하세요.</strong><span>지원 파일 형식: PDF, DOCX, TXT</span><input id="file" type="file" accept=".pdf,.docx,.txt" class="hidden" onchange="document.getElementById('file-label').textContent=this.files[0]?.name||'파일 선택'"></div></div><div class="privacy">${icon('lock')}<span>시안에 입력한 내용과 파일은 서버로 전송하지 않습니다.</span></div><button class="btn start" onclick="showAnalysis()">나의 커리어 경로 찾기 <span>→</span></button></div><div class="experience-visual">${illustration()}<div class="visual-caption"><p>당신의 경험이<br>더 큰 가능성이 되는 순간</p><span>FROM EXPERIENCE<br>TO OPPORTUNITY</span></div></div></section><section class="features"><div class="feature-heading"><div class="section-number">02</div><h2>이런 점이<br>특별해요</h2></div>${[['star','경험 속 나의 강점','지금까지의 경험을 분석해<br>나만의 강점과 역량을 발견합니다.'],['compass','연결되는 커리어 경로','강점과 역량이 연결되는<br>직무와 커리어 경로를 살펴봅니다.'],['chart','다음 도전을 위한 준비','지금의 경험을 바탕으로<br>더 나은 내일을 준비할 수 있습니다.']].map(([ic,t,d])=>`<div class="feature">${circle(ic)}<div><h3>${t}</h3><p>${d}</p></div></div>`).join('')}</section></div><section class="services" id="service"><div class="wrap"><div class="intro"><div class="section-number">03</div><h2>제공 서비스 안내</h2><p>Career Navi는 당신의 경험을 다시 살펴보고,<br>다음 커리어를 판단할 근거를 제공합니다.</p></div>${waves()}<div class="service-list">${[['chart','경험 기반 역량 분석','입력한 경험에서 역량과 그 근거를 살펴봅니다.'],['target','연결 가능한 직무 탐색','나의 경험과 직무별 요구 역량을 비교합니다.'],['compass','다음 준비 안내','보완할 역량과 준비를 시작할 방법을 확인합니다.']].map(([ic,t,d])=>`<div>${circle(ic)}<div><h3>${t}</h3><p>${d}</p></div></div>`).join('')}</div></div></section></main>${banner(false)}`}
const companies=[{name:'NextBridge',abbr:'NB',industry:'IT · 소프트웨어',size:'100~500명',loc:'서울 강남구',work:'주 5일 근무',jobs:8,desc:'기술로 더 나은 세상을 만드는 스타트업입니다.<br>함께 성장할 열정적인 동료를 찾고 있어요.'},{name:'TerraLabs',abbr:'TR',industry:'AI · 데이터',size:'50~200명',loc:'판교',work:'유연근무제',jobs:5,desc:'AI와 데이터로 새로운 문제를 해결하는<br>테크 기업입니다. 함께할 인재를 기다립니다.'},{name:'Planetion',abbr:'PL',industry:'헬스케어 · 바이오',size:'200~1,000명',loc:'서울 송파구',work:'주 5일 근무',jobs:12,desc:'사람들의 더 건강한 삶을 위해<br>바이오 헬스케어 솔루션을 개발합니다.'},{name:'ModeSoft',abbr:'MO',industry:'IT · 소프트웨어',size:'1,000명 이상',loc:'성남 분당구',work:'유연근무제',jobs:6,desc:'더 편리한 일상을 위한 소프트웨어를 만듭니다.<br>문제를 함께 풀어갈 동료를 찾고 있습니다.'},{name:'DataForge',abbr:'DA',industry:'AI · 데이터',size:'200~1,000명',loc:'서울 마포구',work:'주 5일 근무',jobs:6,desc:'데이터로 세상을 더 스마트하게.<br>고객의 문제를 해결하는 데이터 분석 팀입니다.'},{name:'SilverVine',abbr:'SV',industry:'핀테크 · 금융',size:'50~200명',loc:'서울 여의도',work:'유연근무제',jobs:7,desc:'더 나은 금융 경험을 제공하는<br>핀테크 기업입니다. 함께할 인재를 찾습니다.'}];
function card(c){return `<button class="company-card" onclick="companyDialog('${c.name}')"><div class="top"><span class="monogram">${c.abbr}</span><div><h3>${c.name}</h3><div class="industry">${c.industry}</div></div><span class="badge">채용 중 ${c.jobs}개</span></div><div class="meta"><span>${icon('users')}직원 ${c.size}</span><span>${icon('pin')}${c.loc}</span><span>${icon('brief')}${c.work}</span></div><p>${c.desc}</p><span class="arrow">→</span></button>`}
function filter(name,ic,options){return `<label class="filter">${icon(ic)}<select id="${name}" aria-label="${options[0]}" onchange="filterCompanies()">${options.map((o,i)=>`<option value="${i?o:''}">${o}</option>`).join('')}</select></label>`}
function companyPage(){return `${header(true)}${hero(true)}<main><div class="wrap"><form class="searchbar" id="search" onsubmit="event.preventDefault();filterCompanies()"><div class="searchfield">${icon('search')}<label class="sr-only" for="query">회사명, 키워드 검색</label><input id="query" placeholder="회사명, 키워드로 검색해보세요." type="search"><button class="btn" type="submit">검색</button></div>${filter('industry','layers',['산업군 전체','IT · 소프트웨어','AI · 데이터','헬스케어 · 바이오','핀테크 · 금융'])}${filter('size','users',['기업 규모 전체','50~200명','100~500명','200~1,000명','1,000명 이상'])}${filter('work','brief',['근무 형태 전체','주 5일 근무','유연근무제'])}${filter('hiring','calendar',['채용 상태 전체','채용 중'])}</form><section><div class="listing-header"><div><div class="label">EXPLORE COMPANIES</div><h2 id="list-heading">지금, 이런 기업들이 기다리고 있어요.</h2></div><button class="linkbtn" onclick="resetFilters()">전체 보기 →</button></div><div class="company-grid" id="companies">${companies.map(card).join('')}</div></section><section class="reasons" id="how"><div><div class="label">FIND YOUR NEXT TEAM</div><h2>이런 기준으로 살펴보세요</h2></div>${[['target','나의 관심 분야','관심 있는 산업과 직무에서<br>경험을 펼칠 기업을 찾습니다.'],['chart','함께 일하는 방식','기업의 규모와 근무 방식을<br>나의 기준과 비교합니다.'],['users','실제 채용 조건','공고에서 요구하는 경험과<br>역량을 구체적으로 확인합니다.']].map(([ic,t,d])=>`<div class="feature">${circle(ic)}<div><h3>${t}</h3><p>${d}</p></div></div>`).join('')}</section></div></main>${banner(true)}`}
function filterCompanies(){const q=document.getElementById('query').value.toLowerCase().trim();const list=companies.filter(c=>(c.name+' '+c.industry+' '+c.desc).toLowerCase().includes(q)&&['industry','size','work'].every(k=>!document.getElementById(k).value||c[k]===document.getElementById(k).value));document.getElementById('companies').innerHTML=list.length?list.map(card).join(''):'<div class="empty">조건에 맞는 기업이 없습니다. 검색어나 필터를 바꿔보세요.</div>';document.getElementById('list-heading').textContent=`조건에 맞는 기업 ${list.length}곳을 살펴보세요.`}
function resetFilters(){document.getElementById('search').reset();document.getElementById('companies').innerHTML=companies.map(card).join('');document.getElementById('list-heading').textContent='지금, 이런 기업들이 기다리고 있어요.'}
function scrollSection(e,id){e.preventDefault();document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'})}
function showModal(content){document.getElementById('modal-content').innerHTML=content;document.getElementById('modal').showModal()}
function demoDialog(){showModal('<div class="label">TRY WITH AN EXAMPLE</div><h2>어떤 경험으로 시작할까요?</h2><p>직업을 선택하면 직접 입력창에 예시 내용을 채웁니다.</p><div class="choices">'+['사무직','영업직','웹 개발자','디자이너','신입'].map(x=>`<button class="btn ghost" onclick="fillDemo('${x}')">${x}<span>→</span></button>`).join('')+'</div>')}
function fillDemo(role){switchInput(false);document.getElementById('experience').value=role+'으로 일하며 자료를 정리하고 팀의 요구사항을 조율했습니다. 반복되는 업무의 원인을 찾아 공통 양식을 만들고, 결과를 보고서로 정리했습니다. 협업 경험을 다음 직무에서도 활용하고 싶습니다.';document.getElementById('modal').close()}
function switchInput(file){document.getElementById('experience').classList.toggle('hidden',file);document.getElementById('upload').classList.toggle('hidden',!file);document.getElementById('type-tab').classList.toggle('active',!file);document.getElementById('file-tab').classList.toggle('active',file)}
function showAnalysis(){showModal('<div class="label">DESIGN PREVIEW</div><h2>경험에서 경로를 찾는 시작점.</h2><p>입력창과 버튼의 배치를 확인하기 위한 시안입니다. 실제 AI 분석은 호출하지 않으며 입력한 내용도 전송하지 않습니다.</p><button class="btn" onclick="document.getElementById(\'modal\').close()">입력 화면으로 돌아가기</button>')}
function companyDialog(name){const c=companies.find(x=>x.name===name);showModal(`<div class="label">COMPANY PREVIEW</div><h2>${c.name}</h2><p>${c.industry} · ${c.loc}<br>${c.size} · ${c.work}</p><p>${c.desc}</p><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>채용공고 미리보기</h3><p>프로덕트 매니저 · 경력 3년 이상<br>고객 요구사항 정의, 제품 기획, 협업 경험</p><p class="caption">화면 구성을 위한 가상 기업과 예시 공고입니다.</p><button class="btn" onclick="document.getElementById('modal').close()">기업 목록으로 돌아가기</button>`)}
function showFAQ(e){e.preventDefault();showModal('<h2>자주 묻는 질문</h2><h3>직장 경험이 없어도 되나요?</h3><p>네. 프로젝트, 수업, 동아리에서 직접 맡았던 일을 적을 수 있습니다.</p><h3>결과는 합격 가능성을 의미하나요?</h3><p>아닙니다. 보유 경험과 직무의 요구사항을 비교하는 탐색 정보입니다.</p><h3>이 화면에서 실제 분석이 되나요?</h3><p>현재는 검토용 시안으로, 실제 분석과 지원은 연결하지 않았습니다.</p>')}
function render(){const company=location.hash==='#companies';document.getElementById('app').innerHTML=company?companyPage():personal();document.getElementById('personal-link').classList.toggle('active',!company);document.getElementById('companies-link').classList.toggle('active',company);document.title='Career Navi · '+(company?'기업·채용공고 탐색':'개인 경험 입력')+' v2'}
if(new URLSearchParams(location.search).has('capture'))document.body.classList.add('capture');addEventListener('hashchange',()=>{if(['#companies','#personal'].includes(location.hash)){render();window.scrollTo(0,0)}});render();
</script><script src="screens.js?v=5a"></script><script src="refine.js?v=5a"></script><script src="animation.bundle.js"></script><script src="cohesion.js?v=5a"></script></body></html>
