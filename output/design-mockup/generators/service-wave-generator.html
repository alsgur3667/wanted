<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="2400" height="1200"></canvas>
<script>
// 데이터 흐름 비주얼 — 어두운 네이비 위를 흐르는 리본과 입자
const c=document.getElementById('c'),x=c.getContext('2d'),W=c.width,H=c.height;
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
// 바탕
let g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#0a1220');g.addColorStop(.55,'#0d1726');g.addColorStop(1,'#141a24');x.fillStyle=g;x.fillRect(0,0,W,H);
// 은은한 광원
function glow(cx,cy,r,col,a){const rg=x.createRadialGradient(cx,cy,0,cx,cy,r);rg.addColorStop(0,col.replace('A',a));rg.addColorStop(1,col.replace('A',0));x.fillStyle=rg;x.fillRect(cx-r,cy-r,r*2,r*2)}
glow(W*.62,H*.55,900,'rgba(201,138,74,A)',.4);glow(W*.5,H*.52,420,'rgba(255,200,140,A)',.22);
glow(W*.22,H*.35,700,'rgba(30,110,120,A)',.22);
glow(W*.9,H*.2,600,'rgba(60,90,140,A)',.18);
// 리본: 여러 겹의 흐르는 선
x.lineCap='round';
function ribbon(y0,amp,phase,count,hue,alpha,width,speed){
  for(let i=0;i<count;i++){
    const t=i/count;x.beginPath();
    for(let px=-50;px<=W+50;px+=6){
      const u=px/W;
      const y=y0+ (t-.5)*amp*1.6 + Math.sin(u*speed*Math.PI+phase+t*1.4)*amp + Math.sin(u*speed*2.3*Math.PI+phase*1.7+t*3)*amp*.28 + (u-.5)*(u-.5)*-260;
      px===-50?x.moveTo(px,y):x.lineTo(px,y);
    }
    const a=alpha*(0.35+0.65*Math.sin(t*Math.PI));
    x.strokeStyle=`hsla(${hue},${hue<60?70:45}%,${hue<60?68:62}%,${a})`;x.lineWidth=width*(0.6+Math.sin(t*Math.PI));x.stroke();
  }
}
x.globalCompositeOperation='lighter';
ribbon(H*.58,150,0.6,70,205,.16,1.8,1.6);
ribbon(H*.50,120,2.1,80,36,.22,1.6,1.9);
ribbon(H*.66,90,3.4,45,172,.14,1.3,2.4);
ribbon(H*.44,180,1.2,40,30,.10,2.4,1.3);
ribbon(H*.52,60,2.1,14,40,.55,1.2,1.9);
ribbon(H*.60,40,0.6,10,200,.5,1.0,1.6);
// 입자 (보케)
for(let i=0;i<420;i++){
  const px=rnd()*W,py=H*.25+rnd()*H*.6,r=rnd()<.9?rnd()*2.2+.6:rnd()*7+3;
  const warm=rnd()<.6;const col=warm?'255,196,120':'150,220,220';
  const a=(rnd()*.5+.15)*(r>3?.35:1);
  const rg=x.createRadialGradient(px,py,0,px,py,r*2.2);rg.addColorStop(0,`rgba(${col},${a})`);rg.addColorStop(1,`rgba(${col},0)`);x.fillStyle=rg;x.fillRect(px-r*2.2,py-r*2.2,r*4.4,r*4.4);
}
x.globalCompositeOperation='source-over';
// 얇은 그리드 (데이터 느낌) — 아주 옅게
x.strokeStyle='rgba(255,255,255,0.035)';x.lineWidth=1;
for(let gx=0;gx<W;gx+=120){x.beginPath();x.moveTo(gx,0);x.lineTo(gx,H);x.stroke()}
for(let gy=0;gy<H;gy+=120){x.beginPath();x.moveTo(0,gy);x.lineTo(W,gy);x.stroke()}
// 비네트
const v=x.createRadialGradient(W*.5,H*.5,H*.3,W*.5,H*.5,W*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(3,7,14,0.6)');x.fillStyle=v;x.fillRect(0,0,W,H);
</script></body></html>
